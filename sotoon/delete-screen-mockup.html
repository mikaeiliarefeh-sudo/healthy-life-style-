<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#fff;}
svg{display:block;font-family:Arial,Helvetica,sans-serif;}
.h{font-size:21px;font-weight:700;fill:#0f172a;}
.tb{font-size:14px;font-weight:700;fill:#0f172a;}
.t{font-size:13.5px;fill:#1e293b;}
.sm{font-size:12px;fill:#64748b;}
.cost{font-size:12.5px;font-weight:700;fill:#b45309;}
.badge{font-size:11px;font-weight:700;}
.cap{font-size:13px;font-weight:700;fill:#475569;}
</style></head><body>
<svg width="1160" height="724" viewBox="0 0 1160 724" xmlns="http://www.w3.org/2000/svg">

<text x="24" y="34" class="h">Mockup — Delete screen (what the user actually sees)</text>
<text x="24" y="56" class="sm">Example: user clicks "Delete" on a Kubernetes cluster</text>

<!-- window -->
<rect x="24" y="72" width="1112" height="490" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<rect x="24" y="72" width="1112" height="46" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="46" y="101" class="tb">Delete cluster “prod-cluster”  —  review attached resources</text>

<!-- table header -->
<line x1="24" y1="118" x2="1136" y2="118" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="24" y="118" width="1112" height="34" fill="#f8fafc"/>
<text x="46"  y="140" class="sm">RESOURCE</text>
<text x="360" y="140" class="sm">STATUS AFTER DELETE</text>
<text x="700" y="140" class="sm">MONTHLY COST</text>
<text x="880" y="140" class="sm">ACTION</text>
<line x1="24" y1="152" x2="1136" y2="152" stroke="#cbd5e1" stroke-width="1.2"/>

<!-- row 1: workers -->
<text x="46" y="182" class="t">3 × worker + control-plane</text>
<text x="360" y="182" class="t">belongs to this cluster</text>
<text x="700" y="182" class="t">—</text>
<rect x="880" y="166" width="150" height="26" rx="5" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="955" y="184" text-anchor="middle" class="badge" fill="#475569">DELETED AUTOMATICALLY</text>
<line x1="24" y1="200" x2="1136" y2="200" stroke="#e2e8f0" stroke-width="1"/>

<!-- row 2: cluster LB + IP  (orphan) -->
<text x="46" y="230" class="t">cluster LB  +  IP 87.247.169.12</text>
<text x="360" y="230" class="t" fill="#b91c1c">will be attached to nothing</text>
<text x="700" y="230" class="cost">350,000 T</text>
<rect x="880" y="214" width="72" height="26" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="916" y="232" text-anchor="middle" class="badge" fill="#b91c1c">DELETE</text>
<rect x="960" y="214" width="70" height="26" rx="5" fill="#ffffff" stroke="#94a3b8"/>
<text x="995" y="232" text-anchor="middle" class="badge" fill="#475569">KEEP</text>
<line x1="24" y1="248" x2="1136" y2="248" stroke="#e2e8f0" stroke-width="1"/>

<!-- row 3: subnet (orphan) -->
<text x="46" y="278" class="t">subnet “k8s-subnet”</text>
<text x="360" y="278" class="t" fill="#b91c1c">will be empty</text>
<text x="700" y="278" class="t">—</text>
<rect x="880" y="262" width="72" height="26" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="916" y="280" text-anchor="middle" class="badge" fill="#b91c1c">DELETE</text>
<rect x="960" y="262" width="70" height="26" rx="5" fill="#ffffff" stroke="#94a3b8"/>
<text x="995" y="280" text-anchor="middle" class="badge" fill="#475569">KEEP</text>
<line x1="24" y1="296" x2="1136" y2="296" stroke="#e2e8f0" stroke-width="1"/>

<!-- row 4: VPC SHARED -->
<rect x="24" y="296" width="1112" height="60" fill="#f0fdf4"/>
<text x="46" y="326" class="t">VPC “main-vpc”</text>
<text x="46" y="344" class="sm">still used by: 2 VMs, 1 LoadBalancer</text>
<text x="360" y="326" class="t" fill="#15803d">still in use — shared</text>
<text x="700" y="326" class="t">—</text>
<rect x="880" y="310" width="150" height="26" rx="5" fill="#dcfce7" stroke="#16a34a"/>
<text x="955" y="328" text-anchor="middle" class="badge" fill="#15803d">KEPT (no delete offered)</text>
<line x1="24" y1="356" x2="1136" y2="356" stroke="#e2e8f0" stroke-width="1"/>

<!-- row 5: VPC gateway IP shared -->
<text x="46" y="386" class="t">VPC gateway IP 87.247.169.2</text>
<text x="360" y="386" class="t" fill="#15803d">still serves the 2 VMs</text>
<text x="700" y="386" class="t">350,000 T</text>
<rect x="880" y="370" width="150" height="26" rx="5" fill="#dcfce7" stroke="#16a34a"/>
<text x="955" y="388" text-anchor="middle" class="badge" fill="#15803d">KEPT (no delete offered)</text>
<line x1="24" y1="404" x2="1136" y2="404" stroke="#cbd5e1" stroke-width="1.5"/>

<!-- savings callout -->
<rect x="46" y="424" width="600" height="52" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="66" y="448" class="tb">You will free 1 public IP</text>
<text x="66" y="467" class="sm">Monthly saving: 350,000 T  ·  keeping an unattached IP is charged at a higher rate</text>

<!-- buttons -->
<rect x="820" y="500" width="140" height="40" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="890" y="525" text-anchor="middle" class="tb" fill="#475569">Cancel</text>
<rect x="976" y="500" width="140" height="40" rx="7" fill="#dc2626"/>
<text x="1046" y="525" text-anchor="middle" class="tb" fill="#ffffff">Confirm delete</text>

<text x="24" y="600" class="cap">The 3 rules this screen encodes:</text>
<text x="24" y="624" class="t">1. Anything that becomes orphaned  →  offered for deletion (with its cost).</text>
<text x="24" y="646" class="t">2. Anything still shared  →  kept, no delete button, user is only informed.</text>
<text x="24" y="668" class="t">3. Every attached public IP  →  explicit Keep / Release, default Release.</text>

<text x="24" y="700" class="sm">همین صفحه، جایگزینِ فلوی تو در توی چند-تبیِ فعلی می‌شود و «یاداوریِ» گم‌شده را هم پوشش می‌دهد.</text>
</svg>
</body></html>
